name: helm-lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [open5gs, upf, ueransim, subscribers]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint ${{ matrix.chart }}
        run: helm lint charts/${{ matrix.chart }}

      - name: Render ${{ matrix.chart }} with default values
        run: helm template ci charts/${{ matrix.chart }} > /dev/null

  render-conditionals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      # The optional templates are guarded by `if` blocks that default to off,
      # so a plain render never exercises them.
      - name: Core with distributed UPF, subscriber hook and pull-secret creator
        run: |
          helm template ci charts/open5gs \
            --set upf.distributed_upf.enabled=true \
            --set add_subs_auto.helm_post_hook.enabled=true \
            --set global_config.imagePullSecret.image_secret_creator.enabled=true \
            > /dev/null

      - name: Standalone UPF with pull-secret creator
        run: |
          helm template ci charts/upf \
            --set global_config.imagePullSecret.image_secret_creator.enabled=true \
            > /dev/null

      - name: UERANSIM with gNB and UE started and pull-secret creator
        run: |
          helm template ci charts/ueransim \
            --set gnb.start_gnb.enabled=true \
            --set ue.start_ue.enabled=true \
            --set ueransim.imagePullSecret.image_secret_creator.enabled=true \
            > /dev/null

      - name: Subscribers with pull-secret creator
        run: |
          helm template ci charts/subscribers \
            --set global_config.imagePullSecret.image_secret_creator.enabled=true \
            > /dev/null

      # The public-image path: other binary directories, no WebUI, the AMF NGAP as a
      # ClusterIP (no nodePort rendered), and the subscriber import gated on MongoDB with a
      # PCC rule.
      - name: Public images, no WebUI, subscribers waiting on MongoDB with a PCC rule
        run: |
          helm template ci charts/open5gs \
            --set open5gs.binPath=/opt/open5gs/bin \
            --set webui.enabled=false \
            --set amf.service.ngap.type=ClusterIP \
            > /dev/null
          helm template ci charts/upf --set open5gs.binPath=/opt/open5gs/bin > /dev/null
          helm template ci charts/ueransim \
            --set ueransim.binPath=/usr/local/bin \
            --set gnb.start_gnb.enabled=true \
            --set ue.start_ue.enabled=true \
            > /dev/null
          helm template ci charts/subscribers \
            -f charts/subscribers/ci/public-images-values.yaml > /dev/null
