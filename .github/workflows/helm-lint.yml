name: helm-lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint
        run: helm lint open5gs-helm-chart

      - name: Render templates with default values
        run: helm template open5gs open5gs-helm-chart > /dev/null

      - name: Render templates with distributed UPF enabled
        run: |
          helm template open5gs open5gs-helm-chart \
            --set upf.distributed_upf.enabled=true \
            --set add_subs_auto.helm_post_hook.enabled=true \
            --set global_config.imagePullSecret.image_secret_creator.enabled=true \
            > /dev/null
