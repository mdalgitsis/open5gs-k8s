{{- if .Values.ueransim.imagePullSecret.image_secret_creator.enabled }}
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .Values.ueransim.imagePullSecret.name }}
stringData:
  .dockerconfigjson: >-
      {
        "auths": {
          "{{ .Values.ueransim.imagePullSecret.registry }}": {
            "username": "{{ .Values.ueransim.imagePullSecret.username }}",
            "password": "{{ .Values.ueransim.imagePullSecret.password }}"
          }
        }
      }
{{- end }}
