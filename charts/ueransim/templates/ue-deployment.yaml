apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: ueransim-ue-depl
  labels:
    ueransim-type: ue
spec:
  replicas: 1
  selector:
    matchLabels:
      ueransim-type: ue
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ue-configmap.yaml") . | sha256sum }}
      labels:
        ueransim-type: ue
    spec:    
      containers:
        - name: ueransim-ue
          image: "{{ .Values.ueransim.image.repository }}:{{ .Values.ueransim.image.tag }}"
          imagePullPolicy: {{ .Values.ueransim.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          {{- if .Values.ue.start_ue.enabled }}
          command: ["/bin/sh"]
          args: ["-c", "./nr-ue -c config/open5gs-ue.yaml"]
          {{- end }}
          volumeMounts:
          - name: ue-cmap
            mountPath: /ueransim/config/open5gs-ue.yaml
            subPath: "open5gs-ue.yaml"
      {{- if .Values.ueransim.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: "{{ .Values.ueransim.imagePullSecret.name }}"
      {{- end }}
      volumes:
        - name: ue-cmap
          configMap:
            name: ue-cmap
      {{- if .Values.node_labels.enabled }}
      nodeSelector:
        {{- .Values.node_labels.node_selector | toYaml | nindent 8 }}
      {{- end }}