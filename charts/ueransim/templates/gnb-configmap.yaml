apiVersion: v1
kind: ConfigMap
metadata:
  name: gnb-cmap
  labels:
    ueransim-mode: gnb
data:
  open5gs-gnb.yaml: |
    mcc: {{ .Values.plmn.mcc }}          # Mobile Country Code value
    mnc: {{ .Values.plmn.mnc }}          # Mobile Network Code value (2 or 3 digits)

    nci: '0x000000010'                        # NR Cell Identity (36-bit)
    idLength: 32                              # NR gNB ID length in bits [22...32]
    tac: {{ .Values.plmn.tac }}               # Tracking Area Code

    linkIp: {{ .Values.gnb.interfaces.n3.ip }}     # gNB's local IP address for Radio Link Simulation (Usually same with local IP)
    ngapIp: {{ .Values.gnb.interfaces.n2.ip }}     # gNB's local IP address for N2 Interface (Usually same with local IP)
    gtpIp: {{ .Values.gnb.interfaces.radio.ip }}   # gNB's local IP address for N3 Interface (Usually same with local IP)

    # List of AMF address information
    amfConfigs:
      - address: {{ .Values.gnb.amf.ip }}
        port: 38412

    # List of supported S-NSSAIs by this gNB
    slices:
      {{- .Values.slices | toYaml | nindent 6 }}

    # Indicates whether or not SCTP stream number errors should be ignored.
    ignoreStreamIds: true
